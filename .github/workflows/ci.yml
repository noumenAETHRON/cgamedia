name: CI

on:
  push:

jobs:
  check:
    name: test y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
